[project]
name = "waamanomalydetection"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "graphviz>=0.21",
    "jupyterlab>=4.5.0",
    "matplotlib>=3.10.7",
    "opencv-python>=4.12.0.88",
    "tensorboard>=2.20.0",
    "torchinfo>=1.8.0",
    "torchview>=0.2.7",
    "transformers>=5.2.0",
    "torch",
    "torchvision",
    "pandas>=3.0.1",
    "openpyxl>=3.1.5",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu118" },
]
torchvision = [
  { index = "pytorch-cu118" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
